<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Problema 1 - Calificación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="navbar-container"></div>
<script>
fetch("navbar.html")
    .then(response => response.text())
    .then(data => {
        document.getElementById("navbar-container").innerHTML = data;
    });
</script>

<div class="container mt-4">
    <h1>Determinar la calificación</h1>

    <form class="mt-4">
        <div class="mb-3">
            <label class="form-label">Parcial 1</label>
            <input type="number" id="nota1"  class="form-control" min="0" max="100" oninput="this.value=this.value.replace(/^0+/,'')||0">
        </div>

        <div class="mb-3">
            <label class="form-label">Parcial 2</label>
            <input type="number" id="nota2" class="form-control" min="0" max="100" oninput="this.value=this.value.replace(/^0+/,'')||0">
        </div>

        <div class="mb-3">
            <label class="form-label">Parcial 3</label>
            <input type="number" id="nota3" class="form-control" min="0" max="100" oninput="this.value=this.value.replace(/^0+/,'')||0">
        </div>

        <div class="mb-3">
            <button type="button" onclick="calcularNota()" class="btn btn-primary">Calcular</button>
        </div>

        <div class="mb-3" id="resultado">

        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/problema1.js"></script>
</body>
</html>
